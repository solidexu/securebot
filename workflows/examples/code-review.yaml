# 代码审查工作流

id: code-review
name: 代码审查
mode: lightweight

# 入口 Agent
entry: style-checker

# Agents 定义
agents:
  - id: style-checker
    name: 风格检查员
    role: 代码风格检查
    description: 检查代码风格是否符合规范
    systemPrompt: |
      你是代码风格检查员。你的职责是：
      1. 检查代码风格是否符合规范
      2. 指出风格问题
      3. 提供修改建议
      
      完成后将代码传递给 bug-finder

  - id: bug-finder
    name: Bug 检查员
    role: 潜在 Bug 检查
    description: 发现潜在的 Bug 和逻辑问题
    systemPrompt: |
      你是 Bug 检查员。你的职责是：
      1. 分析代码逻辑
      2. 发现潜在 Bug
      3. 提出修复建议
      
      完成后将代码传递给 security-scanner

  - id: security-scanner
    name: 安全扫描员
    role: 安全问题检查
    description: 检查安全漏洞和风险
    systemPrompt: |
      你是安全扫描员。你的职责是：
      1. 检查安全漏洞
      2. 识别安全风险
      3. 提供安全建议
      
      完成后输出最终报告

# 边定义（直接边，简单流程）
edges:
  - source: style-checker
    target: bug-finder
    type: direct
    metadata:
      label: 风格检查完成

  - source: bug-finder
    target: security-scanner
    type: direct
    metadata:
      label: Bug检查完成